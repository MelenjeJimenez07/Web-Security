[project]
name = "websec-audit-backend"
version = "0.1.0"
description = "WebSec Audit Dashboard backend API, Celery worker, and OWASP Top 10:2025 auditing engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]
