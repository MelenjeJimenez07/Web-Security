services:
  postgres:
    image: postgres:16-alpine
    container_name: websec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-websec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-websec_audit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-websec} -d ${POSTGRES_DB:-websec_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: websec-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: websec-migrate
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: websec-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - reports_data:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal_net
      - app_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: websec-celery-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-websec}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_LOCAL_PASSWORD}@postgres:5432/${POSTGRES_DB:-websec_audit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - reports_data:/app/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal_net
      - app_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: websec-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  reports_data:

networks:
  internal_net:
    driver: bridge
    internal: true
  app_net:
    driver: bridge
